version: '3.8'
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    # Se desejado, adicione volumes para persistência
    # volumes:
    #   - ./ollama-data:/var/lib/ollama

  gotenberg:
    image: thecodingmachine/gotenberg:7
    container_name: gotenberg
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DISABLE_GOOGLE_CHROME=false
